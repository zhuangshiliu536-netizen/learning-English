<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#edf0eb">
  <title>Milo · 缩放调试预览</title>
  <link rel="stylesheet" href="./preview.css?v=0.3.7">
</head>
<body>
  <header class="preview-toolbar">
    <div class="toolbar-heading">
      <div><h1>Milo <span>缩放调试</span></h1><p>固定画布 2400 × 1600 · 3:2 · 宽高同比例缩放</p></div>
      <a id="return-to-app" href="./index.html" target="_top">返回正常体验 ↗</a>
    </div>
    <div class="zoom-controls" role="group" aria-label="预览缩放控制">
      <div class="zoom-stepper">
        <button id="zoom-out" type="button" aria-label="缩小一档" title="缩小一档：除以 1.25">−</button>
        <label class="percent-field"><input id="zoom-percent" type="number" min="1" max="200" step="0.1" value="100" aria-label="缩放百分比"><span>%</span></label>
        <button id="zoom-in" type="button" aria-label="放大一档" title="放大一档：乘以 1.25">+</button>
      </div>
      <label class="zoom-slider-label" for="zoom-range">缩放<input id="zoom-range" type="range" min="1" max="200" step="0.1" value="100"></label>
      <div class="zoom-presets" role="group" aria-label="常用缩放比例">
        <button type="button" data-scale="0.25">25%</button>
        <button type="button" data-scale="0.5">50%</button>
        <button type="button" data-scale="0.75">75%</button>
        <button type="button" data-scale="1">100%</button>
      </div>
      <button id="zoom-fit" class="fit-button" type="button" aria-pressed="true">适应窗口</button>
      <output id="zoom-readout">正在准备预览…</output>
    </div>
    <p class="toolbar-note">加减每档按 1.25 倍变化。缩放时保持当前页面与学习进度；放大后可横向、纵向滚动查看。</p>
  </header>
  <main id="preview-workspace" class="preview-workspace" aria-label="可滚动的 Demo 预览画布" tabindex="0">
    <div class="preview-plane">
      <div id="preview-size" class="preview-size">
        <iframe id="demo-frame" title="Milo 首日学习流程，2400×1600 等比预览" width="2400" height="1600" allow="microphone; autoplay"></iframe>
      </div>
    </div>
  </main>
  <script type="module" src="./preview.js?v=0.3.7"></script>
</body>
</html>
